<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ふくし">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fukushi Dōjō</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F9FC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@400;600;700;800;900&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: sticker-cards on a dotted notebook ground; each of the 8 tables keeps its board colour as an index tab. */
:root{
  --bg:#F7F9FC; --dot:#E3E8F0; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#262A33; --muted:#6B7280; --line:#D8DFE9; --shadowc:#E3E9F1;
  --soft:#E9EEF4; --pop:#FF3D7F; --pop-ink:#FFFFFF; --sun:#FFC23D; --good:#10A877; --good-bg:#E2F7EF; --bad:#E8434F; --bad-bg:#FDE8EA;
  --t1:#21B04F; --t2:#6A3BE0; --t3:#1877F4; --t4:#F0602F; --t5:#11A389; --t6:#9A2F72; --t7:#E9A800; --t8:#E2609E;
  --shadow:0 4px 0 var(--shadowc),0 8px 24px rgba(38,52,77,.06); --shadow-sm:0 2px 0 var(--shadowc);
  --f-display:'Unbounded','Nunito',system-ui,sans-serif; --f-body:'Nunito',system-ui,sans-serif; --f-jp:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181F; --dot:#252A34; --surface:#1F232C; --surface2:#262B35; --ink:#EEF1F6; --muted:#A3ABB9; --line:#363D4A; --shadowc:#0E1116;
  --soft:#313744; --pop:#FF5C93; --pop-ink:#1A0610; --sun:#FFCB55; --good:#3DD6A0; --good-bg:#15362D; --bad:#FF6B74; --bad-bg:#3E2228;
  --t1:#3ACB6A; --t2:#8F67F2; --t3:#4B97FF; --t4:#FF7D4F; --t5:#2DC4A6; --t6:#C9529A; --t7:#F7C21E; --t8:#F47DB4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181F; --dot:#252A34; --surface:#1F232C; --surface2:#262B35; --ink:#EEF1F6; --muted:#A3ABB9; --line:#363D4A; --shadowc:#0E1116;
  --soft:#313744; --pop:#FF5C93; --pop-ink:#1A0610; --sun:#FFCB55; --good:#3DD6A0; --good-bg:#15362D; --bad:#FF6B74; --bad-bg:#3E2228;
  --t1:#3ACB6A; --t2:#8F67F2; --t3:#4B97FF; --t4:#FF7D4F; --t5:#2DC4A6; --t6:#C9529A; --t7:#F7C21E; --t8:#F47DB4; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{min-height:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.5px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.tok:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto}
.jp{font-family:var(--f-jp);font-weight:500}
ruby{ruby-position:over}
rt{font-family:var(--f-jp);font-size:.5em;font-weight:500;color:var(--muted);letter-spacing:0}
body.nofuri rt{visibility:hidden}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding-block:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;background:none;border:0;padding:0}
.stamp rt{color:var(--pop-ink);opacity:.85;font-size:9px;font-weight:800}
.stamp{width:44px;height:44px;line-height:1;border-radius:12px;background:var(--pop);color:var(--pop-ink);display:grid;place-items:center;font-family:var(--f-jp);font-weight:800;font-size:24px;border:0;box-shadow:var(--shadow-sm);transform:rotate(-6deg)}
.brand b{font-family:var(--f-jp);font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.05;text-align:left}
.brand small{display:block;font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;box-shadow:var(--shadow-sm);font-variant-numeric:tabular-nums}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow-sm);display:grid;place-items:center;padding:0}
.iconbtn:active{transform:translateY(2px);box-shadow:none}
.iconbtn svg{width:22px;height:22px}
.iconbtn.off{opacity:.45}
.iconbtn .jp{font-size:13px;font-weight:800;line-height:1}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:22px 26px;margin-bottom:28px;position:relative;overflow:hidden}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4vw,34px);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em;text-wrap:balance}
.hero h1 .jp{color:var(--pop);font-weight:800}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.hero .now{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700}
.mascot{width:118px;height:118px}
.mascot.sm{width:72px;height:72px}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

h2.sec{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em}
.sechead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.sechead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;box-shadow:var(--shadow-sm)}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip.on{background:var(--pop);border-color:var(--pop);color:var(--pop-ink)}
.chip.num{width:34px;padding:5px 0;text-align:center}
.label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* table picker */
.tables{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:34px}
.tcard{--c:var(--t1);position:relative;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:30px 14px 14px;box-shadow:var(--shadow);transition:transform .12s;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard:hover{transform:translateY(-2px)}
.tcard:active{transform:translateY(3px);box-shadow:none}
.tcard .tab{position:absolute;top:-2px;left:14px;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;font-size:13px;padding:4px 12px 5px;border:0;border-radius:0 0 12px 12px}
.tcard .check{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface2)}
.tcard.toggled{animation:tog .28s cubic-bezier(.3,1.5,.6,1)}
.tcard.toggled .check{animation:tog .28s cubic-bezier(.3,1.5,.6,1)}
@keyframes tog{40%{transform:scale(.96)}}
.tcard,.tcard .check{transition:transform .12s,background-color .25s}
.tcard.on{background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.tcard.on .check{background:var(--c)}
.tcard .check svg{width:16px;height:16px;opacity:0;stroke:#fff}
.tcard.on .check svg{opacity:1}
.tcard h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.2}
.tcard .words{font-family:var(--f-jp);font-weight:700;font-size:15px;line-height:1.9;color:var(--ink);display:flex;flex-wrap:wrap}
.tcard .words span{white-space:nowrap}
.tcard .words span+span::before{content:'・';color:var(--c)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .4s}
.tcard .meta{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted)}

/* modes */
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.mode{--c:var(--pop);text-align:left;border:2px solid var(--line);border-radius:22px;padding:16px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;transition:transform .12s}
.mode:hover{transform:translateY(-2px) rotate(-.4deg)}
.mode:active{transform:translateY(3px);box-shadow:none}
.mode[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.mode .ic{width:50px;height:50px;border-radius:14px;background:var(--c);border:0;display:grid;place-items:center;margin-bottom:4px}
.mode .ic svg{width:28px;height:28px}
.mode .step{position:absolute;top:14px;right:14px;font-family:var(--f-display);font-weight:800;font-size:12px;color:var(--muted)}
.mode h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:16px}
.mode p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.mode.wide{grid-column:span 2;flex-direction:row;align-items:center;gap:16px}
.mode.wide .ic{margin:0;flex:none}
.hint{background:var(--surface2);border:2px dashed var(--soft);border-radius:18px;padding:14px 18px;margin-top:22px;color:var(--muted);font-size:14px}
.hint b{color:var(--ink)}

/* play shell */
.playbar{display:flex;align-items:center;gap:12px;margin:4px 0 20px}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 18px;font-weight:800;box-shadow:var(--shadow-sm);display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.main{background:var(--pop);border-color:var(--pop);color:var(--pop-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--pop) 55%,#000)}

.btn.sm{padding:6px 12px;font-size:14px;border-radius:11px}
.prog{flex:1;height:14px;border:2px solid var(--line);border-radius:99px;background:var(--surface);overflow:hidden}
.prog i{display:block;height:100%;background:var(--sun);transition:width .35s;border-right:2px solid var(--line)}
.prog i[style*="width: 0"]{border:0}
.stage{max-width:760px;margin:0 auto}
.card{background:var(--surface);border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:24px}
.qtag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
.qtag i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--pop));border:2px solid var(--line)}
.sent{font-family:var(--f-jp);font-weight:500;font-size:clamp(22px,4.4vw,30px);line-height:2.15;margin:0 0 6px;word-break:keep-all;overflow-wrap:anywhere}
.sent.md{font-size:20px;line-height:2}
.sent.sm{font-size:17px;line-height:1.95}
.tok{cursor:pointer;border-radius:6px;padding:0 1px;transition:background .15s}
.tok:hover{background:var(--soft)}
.hl{color:var(--c,var(--pop));font-weight:800}
.slot{color:var(--c,var(--pop));font-weight:800;cursor:pointer;border-bottom:3px solid currentColor}
.gap{display:inline-block;min-width:4.2em;height:1.25em;vertical-align:-.15em;border:2.5px dashed var(--c,var(--pop));border-radius:10px;margin:0 3px;background:color-mix(in srgb,var(--c,var(--pop)) 9%,transparent)}
.ru{color:var(--muted);font-weight:600;font-size:16px}
.ctx{background:var(--surface2);border:2px solid var(--soft);border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:14px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px 10px;box-shadow:var(--shadow-sm);font-family:var(--f-jp);font-weight:700;font-size:22px;line-height:1.9;text-align:center;position:relative;min-width:0}
.opt .k{position:absolute;left:10px;top:6px;font-family:var(--f-body);font-size:11px;font-weight:900;color:var(--muted)}
.opt .suf{font-size:.7em;color:var(--muted)}
.opt:hover:not([disabled]){background:var(--surface2)}
.opt:active:not([disabled]){transform:translateY(2px);box-shadow:none}
.opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.opt.no{background:var(--bad-bg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:18px;padding:14px 16px;border:2px solid var(--line);display:grid;gap:6px}
.fb.ok{background:var(--good-bg)}
.fb.no{background:var(--bad-bg)}
.fb h4{margin:0;font-family:var(--f-display);font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.fb p{margin:0;font-size:15px}
.fb .jw{font-family:var(--f-jp);font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spk{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;padding:0;box-shadow:var(--shadow-sm);flex:none}
.spk svg{width:18px;height:18px}
.spk:active{transform:translateY(2px);box-shadow:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:popin .3s cubic-bezier(.3,1.6,.6,1)}
@keyframes popin{from{transform:scale(.92);opacity:.4}}

/* study */
.studyhead{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tgroup{margin-bottom:30px}
.tgroup>h3{font-family:var(--f-display);font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.tgroup>h3 i{width:14px;height:14px;border-radius:5px;background:var(--c);border:2px solid var(--line)}
.scards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.scard{--c:var(--t1);background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.scard .head{background:color-mix(in srgb,var(--c) 16%,var(--surface));border-bottom:2px solid var(--line);padding:14px 16px;display:flex;gap:12px;align-items:center}
.scard .w{font-family:var(--f-jp);font-weight:800;font-size:28px;line-height:1.7;color:var(--ink)}
.scard .w .suf{font-size:.6em;color:var(--muted)}
.scard .m{font-weight:800;line-height:1.3}
.dots{display:flex;gap:3px;margin-top:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--soft)}
.dots i.f{background:var(--c)}
.scard .body{padding:14px 16px;display:grid;gap:10px}
.note{font-size:14.5px;line-height:1.5;margin:0}
.vs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.vs button{font-family:var(--f-jp);font-weight:700;border:2px solid var(--soft);background:var(--surface2);border-radius:999px;padding:2px 10px;font-size:14px}
.exl{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.exl li{display:flex;gap:10px;align-items:flex-start;border-top:2px dashed var(--soft);padding-top:8px}
.exl .tx{min-width:0}
.badge{font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--c);border:1.5px solid var(--c);border-radius:6px;padding:0 5px;vertical-align:2px;margin-left:4px;font-family:var(--f-body)}
.more{justify-self:start}
.flash-target{animation:flashT 1.2s}
@keyframes flashT{0%,40%{box-shadow:0 0 0 6px var(--pop)}}

/* flashcards */
.fc{perspective:1200px;margin:0 auto 18px;max-width:560px}
.fc-in{position:relative;min-height:340px;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:2px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;overflow:auto}
.fc-face.back{transform:rotateY(180deg);justify-content:flex-start;text-align:left;align-items:stretch}
.fc-face .big{font-family:var(--f-jp);font-weight:800;font-size:clamp(40px,9vw,64px);line-height:1.6}
.fc-face .big.ru{font-family:var(--f-display);font-size:clamp(22px,4.5vw,30px);color:var(--ink);line-height:1.25}
.fc-face .tap{color:var(--muted);font-size:13px;font-weight:800}
.fc-band{position:absolute;top:0;left:0;right:0;height:14px;background:var(--c);border-bottom:2px solid var(--line);border-radius:26px 26px 0 0}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:560px;margin:0 auto}
.grade .btn{justify-content:center;flex-direction:column;gap:0;padding:10px 6px}
.grade .btn small{font-weight:700;font-size:12px;opacity:.75}
.g1{background:var(--bad-bg)!important}.g2{background:color-mix(in srgb,var(--sun) 30%,var(--surface))!important}.g3{background:var(--good-bg)!important}

/* match */
.mgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px}
.mcol{display:grid;gap:10px;align-content:start}
.mt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow-sm);text-align:left;min-height:58px;transition:opacity .3s,transform .12s;min-width:0}
.mt.jpw{font-family:var(--f-jp);font-weight:800;font-size:21px;text-align:center;line-height:1.8}
.mt.sel{background:color-mix(in srgb,var(--sun) 40%,var(--surface));transform:translateY(-2px)}
.mt.done{background:var(--good-bg);border-color:var(--good);opacity:.55;pointer-events:none;box-shadow:none}
.mt .sent{margin:0}
.mt .ru{font-size:13px}

/* build */
.line{min-height:76px;border:2.5px dashed var(--soft);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin:14px 0}
.line.ok{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.line.no{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:60px}
.chunk{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:4px 12px;font-family:var(--f-jp);font-weight:700;font-size:20px;line-height:2;box-shadow:var(--shadow-sm)}
.chunk.adv{background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.chunk.used{visibility:hidden}
.chunk:active{transform:translateY(2px);box-shadow:none}

/* blitz */
.timer{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.tring{width:64px;height:64px;flex:none}
.tring text{font-family:var(--f-display);font-weight:800;font-size:26px;fill:var(--ink)}
.combo{font-family:var(--f-display);font-weight:800;color:var(--pop);font-size:18px}
.bigscore{font-family:var(--f-display);font-weight:800;font-size:28px;margin-left:auto;font-variant-numeric:tabular-nums}

/* pairs list */
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pbtn{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:4px;min-width:0}
.pbtn:active{transform:translateY(3px);box-shadow:none}
.pbtn b{font-family:var(--f-jp);font-size:20px;font-weight:800}
.pbtn span{color:var(--muted);font-size:13.5px;line-height:1.4}
.rule{background:color-mix(in srgb,var(--sun) 22%,var(--surface));border:2px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:16px;font-size:14.5px}

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), app=$('#app');
const KANJI=/[一-鿿々]/;
const RUBY=/([一-鿿々]+)\[([^\]]+)\]/g;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ruby=s=>esc(s).replace(RUBY,'<ruby>$1<rt>$2</rt></ruby>');
const plain=s=>s.replace(/\[[^\]]*\]/g,'');
const reading=s=>s.replace(RUBY,'$2');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pickW=(arr,wf)=>{const ws=arr.map(wf),t=ws.reduce((a,b)=>a+b,0);let r=Math.random()*t;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i]}return arr[arr.length-1]};
const BY={};CARDS.forEach(c=>BY[c.id]=c);
const clashOf=id=>{const g=CLASH.find(g=>g.includes(id));return g||[]};
const PUNCT=/^[、。！？「」…]+$/;

/* ---------- state ---------- */
const KEY='fukushi-dojo-v1';
let S={sel:[1],m:{},xp:0,sound:true,furi:true,streak:0,last:'',best:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const M=id=>S.m[id]||0;
function bump(id,d){S.m[id]=Math.max(0,Math.min(5,M(id)+d));if(d>0)S.xp+=10;dayTick();save();topbar()}
function dayTick(){const d=new Date(),t=d.toISOString().slice(0,10);if(S.last===t)return;const y=new Date(d-864e5).toISOString().slice(0,10);S.streak=S.last===y?S.streak+1:1;S.last=t}
const pool=()=>CARDS.filter(c=>S.sel.includes(c.t));
const inPool=id=>S.sel.includes(BY[id].t);

/* ---------- examples ---------- */
const EX=[];CARDS.forEach(c=>c.ex.forEach(l=>{const board=l[0]==='!';const [jp,ru,alt]=l.replace(/^!/,'').split('|');EX.push({card:c,jp,ru,alt:alt?alt.split(','):[],board,key:c.id+'|'+jp})}));
const exOf=id=>EX.filter(e=>e.card.id===id);
let recent=[];
function pickEx(card,filter){let list=exOf(card.id).filter(e=>!recent.includes(e.key));if(filter)list=list.filter(filter);if(!list.length)list=exOf(card.id).filter(filter||(()=>true));if(!list.length)return null;const e=list[Math.random()*list.length|0];recent.push(e.key);if(recent.length>40)recent.shift();return e}

/* ---------- glossary ---------- */
const GK=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
const CW={};CARDS.forEach(c=>{CW[plain(c.w)]=c;if(c.w2)CW[plain(c.w2)]=c});
function gloss(k){
  if(CW[k])return CW[k].ru;
  const num=(k.match(/^\d+/)||[''])[0];let r=k.slice(num.length);
  if(GLOSS[r])return (num?num+' — ':'')+GLOSS[r];
  if(KANJI.test(r[0])||/^[おご]/.test(r)){for(const e of GK){if((KANJI.test(e[0])||/^[おご]/.test(e))&&r.startsWith(e))return (num?num+' — ':'')+GLOSS[e]}}
  return null;
}
const slotForm=(tok,card)=>tok==='**'?card.w:tok.slice(1,-1);
function sentHTML(jp,card,mode){ // mode: gap | fill | plain (no tooltips) | plaingap
  return jp.split(' ').map(t=>{
    if(!t)return'';
    if(t==='**'||/^\*.+\*$/.test(t)){
      if(mode==='gap'||mode==='plaingap')return '<span class="gap" aria-label="пропуск"></span>';
      if(mode==='plain')return `<b class="hl">${ruby(slotForm(t,card))}</b>`;
      const f=slotForm(t,card);return `<span class="slot" tabindex="0" data-r="${esc(reading(f))}" data-g="${esc(card.ru)}">${ruby(f)}</span>`;
    }
    if(PUNCT.test(t)||mode==='plain'||mode==='plaingap')return ruby(t);
    const k=plain(t),g=gloss(k);
    if(!g)return ruby(t);
    return `<span class="tok" tabindex="0" data-r="${esc(reading(t))}" data-g="${esc(g)}">${ruby(t)}</span>`;
  }).join('');
}
const spoken=(jp,card)=>jp.split(' ').map(t=>t==='**'||/^\*.+\*$/.test(t)?plain(slotForm(t,card)):plain(t)).join('');
const wordHTML=c=>ruby(c.w)+(c.w2?' <span class="suf">/</span> '+ruby(c.w2):'')+(c.suf?`<span class="suf">${c.suf}</span>`:'');
const wordShort=c=>ruby(c.w)+(c.suf?`<span class="suf">${c.suf}</span>`:'');

/* ---------- tooltip ---------- */
const tip=$('#tip');let tipEl=null;
function showTip(el){
  if(tipEl===el){hideTip();return}
  tipEl=el;
  const surf=el.querySelector('ruby')?Array.from(el.childNodes).map(n=>n.nodeName==='RUBY'?n.firstChild.textContent:n.textContent).join(''):el.textContent;
  const rd=el.dataset.r;tip.innerHTML=`<span class="r">${esc(surf)}${rd!==surf?`<small>${esc(rd)}</small>`:''}</span>${ruby(el.dataset.g)}`;
  const b=el.getBoundingClientRect();tip.classList.add('on');
  const w=tip.offsetWidth,h=tip.offsetHeight;let x=b.left+b.width/2-w/2+scrollX;x=Math.max(8+scrollX,Math.min(x,scrollX+innerWidth-w-8));
  let y=b.top+scrollY-h-8;if(b.top-h-8<0)y=b.bottom+scrollY+8;tip.style.left=x+'px';tip.style.top=y+'px';
  snd('tick');
}
function hideTip(){tipEl=null;tip.classList.remove('on')}
document.addEventListener('click',e=>{const t=e.target.closest('.tok,.slot');if(t){e.stopPropagation();showTip(t)}else hideTip()},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement&&document.activeElement.matches('.tok,.slot')){showTip(document.activeElement)}});
addEventListener('scroll',hideTip,{passive:true});addEventListener('resize',hideTip);

/* ---------- sound ---------- */
let AC=null;
function snd(type){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const now=AC.currentTime;
    const note=(f,t0,dur,vol,wave)=>{const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=2200;o.type=wave||'sine';o.frequency.setValueAtTime(f,now+t0);g.gain.setValueAtTime(0,now+t0);g.gain.linearRampToValueAtTime(vol,now+t0+.012);g.gain.exponentialRampToValueAtTime(.0001,now+t0+dur);o.connect(fl);fl.connect(g);g.connect(AC.destination);o.start(now+t0);o.stop(now+t0+dur+.02);return o};
    if(type==='tap'){const o=note(620,0,.09,.05);o.frequency.exponentialRampToValueAtTime(420,now+.08)}
    else if(type==='tick'){note(880,0,.05,.02)}
    else if(type==='ok'){note(660,0,.18,.05,'triangle');note(990,.08,.26,.045,'triangle')}
    else if(type==='no'){const o=note(330,0,.22,.045);o.frequency.exponentialRampToValueAtTime(240,now+.2)}
    else if(type==='flip'){const o=note(400,0,.12,.03);o.frequency.exponentialRampToValueAtTime(700,now+.1)}
    else if(type==='win'){[523,659,784,1046].forEach((f,i)=>note(f,i*.09,.3,.045,'triangle'))}
  }catch(e){}
}
document.addEventListener('click',e=>{if(e.target.closest('button:not(.tok):not(.slot)'))snd('tap')});

/* ---------- speech ---------- */
const canSpeak='speechSynthesis' in window;
let jaVoice=null;
function pickVoice(){try{jaVoice=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang))||null}catch(e){}}
if(canSpeak){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function say(text){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';if(jaVoice)u.voice=jaVoice;u.rate=.88;speechSynthesis.speak(u)}catch(e){}}
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const spkBtn=t=>canSpeak?`<button class="spk" data-say="${esc(t)}" aria-label="Послушать" title="Послушать">${SPK}</button>`:'';
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say)});

/* ---------- toast ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}

  return `<svg class="mascot ${cls||''}" viewBox="0 0 120 120" aria-hidden="true">
   <ellipse cx="60" cy="110" rx="34" ry="5" fill="#000" opacity=".12"/>

   <path d="M30 84h60v20H34c-6 0-11-3-13-8z" fill="#263238"/><path d="M30 84h60v20H34c-6 0-11-3-13-8" fill="none" stroke="#3A3F4C" stroke-width="4" stroke-linejoin="round"/>
   <rect x="52" y="88" width="16" height="10" rx="3" fill="#FF3D7F"/>

   <circle cx="60" cy="28" r="4" fill="#FFC23D" stroke="#3A3F4C" stroke-width="2"/>
  </svg>`;
}

const IC={
 book:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h6v17H6a2 2 0 0 0-2 2z"/><path d="M20 5a2 2 0 0 0-2-2h-6v17h6a2 2 0 0 1 2 2z"/></svg>',

/* ---------- options / distractors ---------- */
function distractors(card,alt,n){
  const ex=new Set([card.id,...alt,...clashOf(card.id)]);
  const cand=pool().filter(c=>!ex.has(c.id));
  const near=shuffle(cand.filter(c=>(card.vs||[]).includes(c.id)||(c.vs||[]).includes(card.id)));
  const rest=shuffle(cand.filter(c=>!near.includes(c)));
  let out=[...near.slice(0,Math.ceil(n/2)),...rest].slice(0,n);
  if(out.length<n){out=[...out,...near.slice(Math.ceil(n/2))].slice(0,n)}
  if(out.length<1){out=shuffle(CARDS.filter(c=>!ex.has(c.id))).slice(0,n)}
  return out;
}

            <div style="font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.25">${esc(c.ru)}</div>

          </div></div></div>
        <div class="grade" id="grade" hidden>
          <button class="btn g1" data-g="1">Не помню<small>покажу скоро</small></button>
          <button class="btn g2" data-g="2">Почти<small>ещё раз позже</small></button>
          <button class="btn g3" data-g="3">Знаю!<small>убрать</small></button></div>`;
      app.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{dir=b.dataset.dir;next()});
      const fc=app.querySelector('.fc'),flip=()=>{if(!fc.classList.contains('flip')){fc.classList.add('flip');snd('flip');$('#grade').hidden=false}};
      $('#fcin').onclick=e=>{if(!e.target.closest('.tok,.slot,.spk'))flip()};$('#fcin').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};
      app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
        const g=+b.dataset.g;q.shift();
        if(g===1){bump(c.id,-1);q.splice(Math.min(2,q.length),0,c);if(!miss.includes(c))miss.push(c)}
        else if(g===2){q.push(c)}

  const c=pickCard(),e=pickEx(c);const d=distractors(c,e.alt,nOpts-1);

}
function fill(){
  const N=10;let i=0,ok=0,miss=[];

function availPairs(){return PAIRS.map(p=>({p,ids:p.ids.filter(inPool),q:p.q.filter(q=>inPool(q.a))})).filter(x=>x.ids.length>=2&&x.q.length)}
function pairs(){
  const av=availPairs();
  shell('Не путай!',av.length?`<p class="ru" style="margin:0 0 14px">Выбери пару похожих слов или пройди все подряд. Сначала прочитай правило — оно короткое.</p>

    <div class="plist">${av.map((x,i)=>`<button class="pbtn" data-p="${i}"><b>${x.ids.map(id=>ruby(BY[id].w)).join(' · ')}</b><span>${ruby(x.p.rule.split('. ')[0])}.</span></button>`).join('')}</div>`
    :`<div class="card empty">${mascot('sad','sm')}<p>В выбранных табличках нет похожих пар.<br>Включи ещё таблички (например, 5 и 7 или 8) — и здесь появятся задания.</p></div>`);
  setSc(`${av.length} ${plural(av.length,['пара','пары','пар'])}`);
  if(!av.length)return;
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>pairRun([av[+b.dataset.p]]));
  $('#allp').onclick=()=>pairRun(av);
}
function pairRun(list){
  let Q=[];list.forEach(x=>x.q.forEach(q=>Q.push({x,q})));Q=list.length===1?shuffle(Q):shuffle(Q).slice(0,12);
  const N=Q.length;let i=0,ok=0,miss=[];
  shell('',`<div></div>`,0);
  const next=()=>{
    if(i>=N)return result('Теперь не перепутаешь!',ok,N,miss,pairs);
    const {x,q}=Q[i],c=BY[q.a];setProg(i/N*100);setSc(`★ ${ok}`);
    const st=app.querySelector('.stage');
    st.innerHTML=`<div class="rule"><b>${ruby(x.p.title)}</b>${ruby(x.p.rule)}</div>
     <div class="card pop" style="--c:var(--t${c.t})"><div class="qtag"><i></i>Ситуация · ${i+1}/${N}</div><div class="ctx">${ruby(q.ctx)}</div>
     <div class="sent">${sentHTML(q.s,c,'gap')}</div>
     <div class="opts">${shuffle(x.ids).map((id,k)=>`<button class="opt" data-id="${id}"><span class="k">${k+1}</span>${wordShort(BY[id])}</button>`).join('')}</div><div id="fbx"></div></div>`;
    const answer=id=>{
      if(st.querySelector('.opt[disabled]'))return;
      const right=id===q.a;st.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.id===q.a)b.classList.add('ok');else if(b.dataset.id===id)b.classList.add('no')});
      if(right){ok++;bump(q.a,1);snd('ok')}else{bump(q.a,-1);snd('no');miss.push({e:{jp:q.s,ru:q.ctx,card:c},picked:id});st.querySelector('.card').classList.add('shake')}
      $('#fbx').innerHTML=`<div class="fb ${right?'ok':'no'}"><h4>${right?'Точно!':'Здесь нужно'} <span class="jw">${wordShort(c)}</span></h4>
        <div class="row">${spkBtn(spoken(q.s,c))}<div class="sent md" style="margin:0;flex:1;min-width:0">${sentHTML(q.s,c,'fill')}</div></div>
        <p>${esc(c.ru)}. ${ruby(c.note)}</p><div class="row end"><button class="btn main" id="nx">Дальше →</button></div></div>`;
      $('#nx').focus({preventScroll:true});$('#nx').onclick=()=>{i++;next()};setSc(`★ ${ok}`);
    };
    st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.id));
    keyOpts=k=>{const b=st.querySelectorAll('.opt')[k];if(b&&!b.disabled)answer(b.dataset.id)};
  };
  next();
}

/* ---------- BUILD ---------- */
const AUX=new Set('は が を に で へ と も の から まで より や ね よ か な では には なら けど ので ん です でした でしょう だ だった じゃ ない なかった います いました いません いる いて いましょう ください くれる きた きました みて みたい みます みよう しまいました しまいます ございます'.split(' '));
function chunks(jp){
  const out=[];jp.split(' ').forEach(t=>{
    const isSlot=t==='**'||/^\*.+\*$/.test(t);const k=plain(t);
    if(out.length&&!isSlot&&(PUNCT.test(k)||AUX.has(k)))out[out.length-1].t.push(t);
    else out.push({t:[t],adv:isSlot});
  });return out;
}
function buildable(e){if(/[「」]/.test(e.jp))return false;const n=chunks(e.jp).length;return n>=3&&n<=7}
function build(){
  const N=8;let i=0,ok=0,miss=[];
  shell('',`<div></div>`,0);
  const next=()=>{
    if(i>=N)return result('Фразы собраны!',ok,N,miss,build);
    const bl=pool().filter(c=>exOf(c.id).some(buildable));if(!bl.length)return result('Фразы собраны!',ok,i,miss,build);const c=pickCard(bl);const e=pickEx(c,buildable);
    if(!e){i++;return next()}
    const ch=chunks(e.jp).map((x,j)=>({...x,j,h:sentHTML(x.t.join(' '),c,'plain')}));
    let order=shuffle(ch.map(x=>x.j));if(order.every((v,k)=>v===k))order=order.reverse();
    const picked=[];setProg(i/N*100);setSc(`★ ${ok}`);
    const st=app.querySelector('.stage');
    st.innerHTML=`<div class="card pop" style="--c:var(--t${c.t})"><div class="qtag"><i></i>Собери фразу · ${i+1}/${N}</div>
      <div class="ru" style="font-size:18px;color:var(--ink);font-weight:700">${esc(e.ru)}</div>
      <div class="line" id="line"></div><div class="bank" id="bank">${order.map(j=>`<button class="chunk ${ch[j].adv?'adv':''}" data-j="${j}">${ch[j].h}</button>`).join('')}</div>
      <div class="row end" style="margin-top:16px"><button class="btn" id="clr">Сбросить</button><button class="btn main" id="chk" disabled>Проверить</button></div><div id="fbx"></div></div>`;
    const line=$('#line'),bank=$('#bank');
    const draw=()=>{line.innerHTML=picked.map(j=>`<button class="chunk ${ch[j].adv?'adv':''}" data-u="${j}">${ch[j].h}</button>`).join('');
      bank.querySelectorAll('.chunk').forEach(b=>b.classList.toggle('used',picked.includes(+b.dataset.j)));$('#chk').disabled=picked.length!==ch.length;
      line.querySelectorAll('[data-u]').forEach(b=>b.onclick=ev=>{if(ev.target.closest('.tok,.slot'))return;if(line.classList.contains('ok')||line.classList.contains('no'))return;picked.splice(picked.indexOf(+b.dataset.u),1);draw()})};
    bank.querySelectorAll('.chunk').forEach(b=>b.onclick=ev=>{if(ev.target.closest('.tok,.slot'))return;const j=+b.dataset.j;if(!picked.includes(j)&&!line.className.match(/ok|no/)){picked.push(j);draw()}});
    $('#clr').onclick=()=>{if(line.className.match(/ok|no/))return;picked.length=0;draw()};
    $('#chk').onclick=()=>{
      const exact=picked.every((v,k)=>v===k);
      let flex=false;const aj=ch.findIndex(x=>x.adv);
      if(!exact&&!e.jp.slice(0,-1).includes('。')&&ch[aj].t.length===1){const a=picked.filter(j=>j!==aj),b=ch.map(x=>x.j).filter(j=>j!==aj);flex=a.every((v,k)=>v===b[k])&&picked[picked.length-1]!==aj}
      const right=exact||flex;line.classList.add(right?'ok':'no');
      if(right){ok++;bump(c.id,1);snd('ok')}else{bump(c.id,-1);snd('no');miss.push({e,picked:null});st.querySelector('.card').classList.add('shake')}
      $('#clr').disabled=true;$('#chk').disabled=true;
      $('#fbx').innerHTML=`<div class="fb ${right?'ok':'no'}"><h4>${exact?'Идеально!':flex?'Тоже можно! Но чаще говорят так:':'Вот как правильно:'}</h4>
       <div class="row">${spkBtn(spoken(e.jp,c))}<div class="sent md" style="margin:0;flex:1;min-width:0">${sentHTML(e.jp,c,'fill')}</div></div>
       <p><span class="jw">${wordShort(c)}</span> — ${esc(c.ru)}</p><div class="row end"><button class="btn main" id="nx">Дальше →</button></div></div>`;
      $('#nx').focus({preventScroll:true});$('#nx').onclick=()=>{i++;next()};setSc(`★ ${ok}`);
    };
    draw();
  };
  next();
}

/* ---------- MATCH ---------- */
function match(){
  const p=pool();const size=Math.min(5,p.length);const R=size<2?0:3;
  if(!R){shell('Найди пару',`<div class="card empty">${mascot('sad','sm')}<p>Для этой игры нужно хотя бы 2 слова. Включи ещё табличку.</p></div>`);return}
  let r=0,mist=0,found=0,missC=[];const t0=Date.now();
  shell('',`<div></div>`,0);
  const round=()=>{
    if(r>=R){const sec=Math.round((Date.now()-t0)/1000);return result(`Все пары найдены за ${sec} с`,found,found+mist,missC,match,true)}
    // pick set without near-synonyms together
    const set=[];shuffle(p).sort((a,b)=>M(a.id)-M(b.id)+(Math.random()-.5)*3).forEach(c=>{if(set.length<size&&!set.some(s=>clashOf(s.id).includes(c.id)))set.push(c)});
    const ctx=r>0;setProg(r/R*100);setSc(`раунд ${r+1}/${R}`);
    const rights=shuffle(set.map(c=>{if(!ctx)return {id:c.id,h:`<b>${esc(c.ru)}</b>`};const e=pickEx(c,x=>!/[「」]/.test(x.jp))||pickEx(c);return {id:c.id,h:`<div class="sent sm" style="--c:var(--t${c.t})">${sentHTML(e.jp,c,'plaingap')}</div><div class="ru">${esc(e.ru)}</div>`}}));
    const st=app.querySelector('.stage');
    st.innerHTML=`<div class="qtag" style="--c:var(--pop)"><i></i>${ctx?'Слово ↔ ситуация':'Слово ↔ значение'}</div>
      <div class="mgrid"><div class="mcol">${shuffle(set).map(c=>`<button class="mt jpw" data-l="${c.id}">${wordShort(c)}</button>`).join('')}</div>
      <div class="mcol">${rights.map(x=>`<button class="mt" data-r="${x.id}">${x.h}</button>`).join('')}</div></div>`;
    let L=null,Rr=null,left=set.length;
    const tryM=()=>{if(!L||!Rr)return;
      if(L.dataset.l===Rr.dataset.r){[L,Rr].forEach(b=>{b.classList.remove('sel');b.classList.add('done')});bump(L.dataset.l,1);found++;snd('ok');left--;
        if(ctx){const tgt=Rr;const c=BY[L.dataset.l];setTimeout(()=>{tgt.querySelectorAll('.gap').forEach(g=>{g.outerHTML=`<span class="slot">${ruby(c.w)}</span>`})},120)}
        if(!left)setTimeout(()=>{r++;round()},700)}
      else{const a=L,b=Rr;[a,b].forEach(x=>x.classList.add('shake'));mist++;snd('no');const c=BY[a.dataset.l];if(!missC.find(m=>m.c===c))missC.push({c});bump(a.dataset.l,-1);setTimeout(()=>[a,b].forEach(x=>x.classList.remove('shake','sel')),380)}
      L=Rr=null};
    st.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{st.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('sel'));L=b;b.classList.add('sel');tryM()});
    st.querySelectorAll('[data-r]').forEach(b=>b.onclick=ev=>{if(ev.target.closest('.tok'))return;st.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('sel'));Rr=b;b.classList.add('sel');tryM()});
  };
  round();
}

/* ---------- BLITZ ---------- */
let blitzT=null;function stopBlitz(){if(blitzT){clearInterval(blitzT);blitzT=null}}
function blitz(){
  const DUR=60;let left=DUR,score=0,combo=0,cnt=0,ok=0,miss=[],lock=false;
  shell('',`<div class="card" style="text-align:center;display:grid;justify-items:center;gap:12px">${mascot('', 'bob')}
    <h2 class="sec">Блиц: 60 секунд</h2><p class="ru" style="max-width:46ch;margin:0">Вставляй наречия как можно быстрее. Три верных ответа подряд — очки ×2, шесть — ×3. Ошибка сбрасывает серию.</p>
    <p class="label">Рекорд: ${S.best||0}</p><button class="btn main" id="go">Поехали!</button></div>`,0);
  setSc('★ 0');
  $('#go').onclick=()=>{
    const st=app.querySelector('.stage');
    st.innerHTML=`<div class="timer"><svg class="tring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--soft)" stroke-width="7"/><circle id="arc" cx="32" cy="32" r="27" fill="none" stroke="var(--pop)" stroke-width="7" stroke-linecap="round" transform="rotate(-90 32 32)" stroke-dasharray="169.6" stroke-dashoffset="0"/><text id="tl" x="32" y="41" text-anchor="middle">${DUR}</text></svg>
      <span class="combo" id="cb"></span><span class="bigscore" id="bs">0</span></div><div id="bq"></div>`;
    const q=()=>{
      const x=makeQ(3);lock=false;
      $('#bq').innerHTML=`<div class="card pop" style="--c:var(--t${x.c.t})"><div class="sent md">${sentHTML(x.e.jp,x.c,'gap')}</div><div class="ru">${esc(x.e.ru)}</div>
        <div class="opts" style="grid-template-columns:repeat(3,minmax(0,1fr))">${x.opts.map((o,k)=>`<button class="opt" data-id="${o.id}"><span class="k">${k+1}</span>${wordShort(o)}</button>`).join('')}</div></div>`;
      const ans=id=>{if(lock||!blitzT)return;lock=true;cnt++;const right=id===x.c.id;
        $('#bq').querySelectorAll('.opt').forEach(b=>{if(b.dataset.id===x.c.id)b.classList.add('ok');else if(b.dataset.id===id)b.classList.add('no')});
        if(right){combo++;ok++;const mult=1+Math.min(2,Math.floor(combo/3));score+=10*mult;bump(x.c.id,1);snd('ok')}else{combo=0;bump(x.c.id,-1);snd('no');miss.push({e:x.e,picked:id})}
        $('#bs').textContent=score;$('#cb').textContent=combo>=3?`серия ${combo} · ×${1+Math.min(2,Math.floor(combo/3))}`:'';setSc(`★ ${score}`);
        setTimeout(()=>{if(blitzT)q()},right?380:1300)};
      $('#bq').querySelectorAll('.opt').forEach(b=>b.onclick=()=>ans(b.dataset.id));
      keyOpts=k=>{const b=$('#bq').querySelectorAll('.opt')[k];if(b)ans(b.dataset.id)};
    };
    q();
    blitzT=setInterval(()=>{left--;const a=$('#arc');if(!a){stopBlitz();return}a.setAttribute('stroke-dashoffset',169.6*(1-left/DUR));$('#tl').textContent=left;setProg((DUR-left)/DUR*100);
      if(left<=0){stopBlitz();const rec=score>(S.best||0);if(rec){S.best=score;save()}result(rec?`Новый рекорд: ${score}!`:`Очки: ${score}`,ok,cnt,miss,blitz)}},1000);
  };
}

/* ---------- RESULT ---------- */
function result(title,ok,total,miss,again,matchMode){
  stopBlitz();keyOpts=null;
  const pct=total?ok/total:0;snd(pct>=.7?'win':'tap');setProg(100);
  const items=matchMode?miss.map(m=>`<div class="it"><b class="jw jp" style="font-size:20px">${wordShort(m.c)}</b> — ${esc(m.c.ru)}</div>`)
    :miss.map(m=>`<div class="it"><div class="row">${spkBtn(spoken(m.e.jp,m.e.card))}<div style="min-width:0;flex:1"><div class="sent sm" style="--c:var(--t${m.e.card.t})">${sentHTML(m.e.jp,m.e.card,'fill')}</div><div class="ru">${esc(m.e.ru)}</div>
      ${m.picked?`<div class="ru" style="font-size:14px">Ты выбрал: <span class="jp">${ruby(BY[m.picked].w)}</span> (${esc(BY[m.picked].ru)})</div>`:''}</div></div></div>`);
  app.querySelector('.stage').innerHTML=`<div class="card res pop">${mascot(pct>=.8?'joy':pct<.5?'sad':'')}
    <h2>${esc(title)}</h2><div class="num">${ok}<span style="font-size:24px;color:var(--muted)"> / ${total}</span></div>
    <p class="ru" style="margin:0">${pct>=.9?'Великолепно! Слова прочно сидят в голове.':pct>=.7?'Хорошо! Ещё пара кругов — и будет идеально.':pct>=.4?'Неплохо. Загляни в «Изучить» и повтори слабые слова.':'Ничего страшного: ошибки показывают, что повторить. Начни с «Флеш-карточек».'}</p>
    ${items.length?`<div class="mist"><span class="label">Повтори эти фразы</span>${items.join('')}</div>`:''}
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="hm">На главную</button><button class="btn main" id="ag">Ещё раз</button></div></div>`;
  $('#hm').onclick=home;$('#ag').onclick=again;scrollTo({top:0,behavior:'smooth'});
}

topbar();home();

/* ---------- install as app ---------- */
(function(){
  const btn=$('#instBtn');let deferred=null;
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone)return;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;btn.hidden=false});
  addEventListener('appinstalled',()=>{btn.hidden=true;toast('Готово! Игра появилась на главном экране')});
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream&&document.querySelector('link[rel="manifest"]');
  if(ios)btn.hidden=false;
  btn.onclick=async()=>{
    if(deferred){deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;btn.hidden=true;return}
    const box=document.createElement('div');box.className='ios';
    box.innerHTML='<b>Как установить на iPhone</b>Открой эту страницу в Safari, нажми кнопку «Поделиться» (квадрат со стрелкой вверх) и выбери «На экран Домой».<div class="row end"><button class="btn sm">Понятно</button></div>';
    document.body.appendChild(box);box.querySelector('button').onclick=()=>box.remove();
  };
})();
})();
</script>
